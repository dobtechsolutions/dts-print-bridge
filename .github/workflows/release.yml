name: release

on:
  push:
    tags:
      - "dts-print-bridge-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            artifact: DTSPrintBridge-Setup.exe
            bundle_glob: "src-tauri/target/release/bundle/nsis/*-setup.exe"
          - os: macos-latest
            args: "--bundles dmg --target universal-apple-darwin"
            artifact: DTSPrintBridge.dmg
            bundle_glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
          - os: ubuntu-22.04
            args: "--bundles appimage"
            artifact: DTSPrintBridge.AppImage
            bundle_glob: "src-tauri/target/release/bundle/appimage/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Generate icons
        run: npm run icons

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename artifact
        shell: bash
        run: |
          src=$(ls ${{ matrix.bundle_glob }} | head -n1)
          cp "$src" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/dts-print-bridge-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
